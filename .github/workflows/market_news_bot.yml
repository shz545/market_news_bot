name: Market News Bot

on:
  # 既然已經用 cron-job.org 觸發，可以把這裡的自動執行關掉，避免同時跑發生衝突
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: # 保留手動觸發 (cron-job.org 也是用這個)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit seen_news.json
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market News Bot
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.json
          git commit -m "chore: update seen news database" || exit 0
          git push
